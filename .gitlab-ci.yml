stages:
  - test
  - deploy

variables:
  EC2_HOST: "3.91.189.37"
  EC2_USER: "ubuntu"

lint-typecheck:
  stage: test
  image: node:20-alpine
  cache:
    key: "$CI_COMMIT_REF_SLUG-node"
    paths:
      - dashboard/node_modules/
  before_script:
    - cd dashboard
    - npm ci
  script:
    - npm run lint
    - npx tsc --noEmit
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy-production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | base64 -d | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
  script:
    - ssh $EC2_USER@$EC2_HOST "
        set -e &&
        cd /home/ubuntu/ufs-newsletter &&
        git pull origin main &&
        cd dashboard &&
        npm install &&
        npm run build &&
        pm2 restart ufs-newsletter --update-env &&
        cd ../api &&
        source .venv/bin/activate &&
        pip install -r requirements.txt -q &&
        pm2 restart ufs-newsletter-api --update-env &&
        pm2 save &&
        echo 'Deploy complete'
      "
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  environment:
    name: production
    url: http://3.91.189.37
